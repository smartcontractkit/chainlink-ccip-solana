name: Publish GA Image From Release Tag

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  build:
    name: Build & publish (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: chainlink-solana-verifier
            dockerfile: cmd/committeeverifier/Dockerfile
            repository: containers/chainlink-ccip-solana-committee-verifier
          - name: chainlink-solana-executor
            dockerfile: cmd/executor/Dockerfile
            repository: containers/chainlink-ccip-solana-executor
          - name: chainlink-solana-token-verifier
            dockerfile: cmd/tokenverifier/Dockerfile
            repository: containers/chainlink-ccip-solana-token-verifier
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Authenticate to AWS ECR (primary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_PRIMARY }}
          aws-region: us-west-2
          registry-type: private

      - name: Authenticate to AWS ECR (secondary)
        uses: ./.github/actions/aws-ecr-auth
        with:
          role-to-assume: ${{ secrets.CCV_IAM_ROLE_SECONDARY }}
          aws-region: us-east-2
          registry-type: private

      # Release builds are uncached
      - name: Build & publish GA image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY_PRIMARY }}/${{ matrix.image.repository }}:${{ github.ref_name }}
            ${{ secrets.ECR_REGISTRY_SECONDARY }}/${{ matrix.image.repository }}:${{ github.ref_name }}

  build-public:
    name: Build, sign & publish public ${{ matrix.module }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: committee verifier
            repository: chainlink-ccip-solana-committee-verifier
            dockerfile: cmd/committeeverifier/Dockerfile
          - module: executor
            repository: chainlink-ccip-solana-executor
            dockerfile: cmd/executor/Dockerfile
    permissions:
      contents: read
      id-token: write
    uses: smartcontractkit/.github/.github/workflows/reusable-docker-build-publish.yml@f4ff50d0f4713ed7b247dbd8a58316484907f958 # 2026-01-13
    with:
      aws-ecr-name: ${{ matrix.repository }}
      aws-region-ecr: us-east-1
      build-arm64-image: 'true'
      dockerfile: ${{ matrix.dockerfile }}
      docker-build-context: .
      docker-manifest-sign: 'true'
      docker-registry-url-override: public.ecr.aws/chainlink
      git-sha: ${{ github.sha }}
      github-event-name: ${{ github.event_name }}
      github-ref-name: ${{ github.ref_name }}
      github-ref-type: ${{ github.ref_type }}
      github-workflow-repository: ${{ github.repository }}
    secrets:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID_SDLC }}
      AWS_ROLE_PUBLISH_ARN: ${{ secrets.CCV_IAM_ROLE_SDLC }}

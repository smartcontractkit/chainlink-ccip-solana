    example_ccip_receiver_v2 = "CbYiUaBi9nx1m3XhADWTdPoN25zeg5qDFBpbEfWKmrCL"
    example_ccip_sender = "E67f8sC5GbpeKCm3595t7sYVzd2k5frcqZAZZ1v4QECo"

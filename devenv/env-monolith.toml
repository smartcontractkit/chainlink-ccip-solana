# JD-managed devenv config: 2 Solana chains + 1 EVM (Anvil) chain.
# Supports Solana→Solana, EVM→Solana, and Solana→EVM directions.
# Run with: make start-devenv

#
# Chain IDs come from chain-selectors test_selectors_solana.yml and selectors.yml files:
#   "22222222222222222222222222222222222222222222" → selector 12463857294658392847
#   "1337" → selector 3379446385462418246

cl_nodes_funding_eth = 50
cl_nodes_funding_link = 50
high_availability = false

#############################
# Environment Topology      #
#############################

[environment_topology]
indexer_address = ["http://indexer-1:8100"]
pyroscope_url = "http://host.docker.internal:4040"

[environment_topology.monitoring]
Enabled = false

# NOPs – standalone verifiers + executors
# EVM verifiers (read from EVM source chain for EVM→Solana direction)
[[environment_topology.nop_topology.nops]]
alias = "evm-verifier-1"
name = "evm-verifier-1"
mode = "standalone"

[[environment_topology.nop_topology.nops]]
alias = "evm-verifier-2"
name = "evm-verifier-2"
mode = "standalone"

# Solana verifiers (read from Solana source chains for S2S and S2EVM directions)
[[environment_topology.nop_topology.nops]]
alias = "solana-verifier-1"
name = "solana-verifier-1"
mode = "standalone"

[[environment_topology.nop_topology.nops]]
alias = "solana-verifier-2"
name = "solana-verifier-2"
mode = "standalone"

# Executors
[[environment_topology.nop_topology.nops]]
alias = "default-executor-1"
name = "default-executor-1"
mode = "standalone"

[[environment_topology.nop_topology.nops]]
alias = "solana-executor-1"
name = "solana-executor-1"
mode = "standalone"

# Solana devenv currently supports exactly one default CommitteeVerifier instance.
# The default committee covers EVM (3379446385462418246) and both Solana chains
# (12463857294658392847) through that single program ID.
# verifier_version "2.0.0" is required for EVM CommitteeVerifier contract deployment.
[environment_topology.nop_topology.committees.default]
qualifier = "default"
verifier_version = "2.0.0"
storage_locations = ["postgres://default-aggregator-db:5432/aggregator"]

[[environment_topology.nop_topology.committees.default.aggregators]]
name = "default"
address = "default-aggregator:50051"
insecure_connection = true

# EVM source chain → EVM verifiers read and sign
[environment_topology.nop_topology.committees.default.chain_configs.3379446385462418246]
nop_aliases = ["evm-verifier-1", "evm-verifier-2"]
threshold = 2

# Solana source chain 1 → Solana verifiers read and sign
[environment_topology.nop_topology.committees.default.chain_configs.12463857294658392847]
nop_aliases = ["solana-verifier-1", "solana-verifier-2"]
threshold = 2
fee_aggregator = "9n1pyVGGo6V4mpiSDMVay5As9NurEkY283wwRk1Kto2C"

# EVM destination executor
[environment_topology.executor_pools.default.chain_configs.3379446385462418246]
nop_aliases = ["default-executor-1"]
execution_interval = 15000000000

# Solana destination executor (chain 1)
[environment_topology.executor_pools.default.chain_configs.12463857294658392847]
nop_aliases = ["solana-executor-1"]
execution_interval = 15000000000

#############################
# Infrastructure            #
#############################

[cldf]

[jd]
  csa_encryption_key = "d1093c0060d50a3c89c189b2e485da5a3ce57f3dcb38ab7e2c0d5f0bb2314a44"
  image = "job-distributor:local"


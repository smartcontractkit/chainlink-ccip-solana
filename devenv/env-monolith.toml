#############################
# Verifiers (standalone)    #
#############################

# EVM verifiers — read from the EVM source chain (EVM→Solana direction)
[[verifier]]
  image = "verifier:latest"
  container_name = "evm-verifier-1"
  nop_alias = "evm-verifier-1"
  port = 8100
  committee_name = "default"
  node_index = 0
  [verifier.db]
    image = "postgres:16-alpine"
    name = "evm-verifier-1-db"
    port = 8432

[[verifier]]
  image = "verifier:latest"
  container_name = "evm-verifier-2"
  nop_alias = "evm-verifier-2"
  port = 8200
  committee_name = "default"
  node_index = 1
  [verifier.db]
    image = "postgres:16-alpine"
    name = "evm-verifier-2-db"
    port = 8433

# Solana verifiers — read from the Solana source chain (Solana→EVM direction)
# node_index must be unique across all verifiers in the committee (EVM uses 0,1).
[[verifier]]
  image = "solana-verifier:latest"
  container_name = "solana-verifier-1"
  nop_alias = "solana-verifier-1"
  port = 8300
  committee_name = "default"
  node_index = 2
  chain_family = "solana"
  [verifier.db]
    image = "postgres:16-alpine"
    name = "solana-verifier-1-db"
    port = 8436

[[verifier]]
  image = "solana-verifier:latest"
  container_name = "solana-verifier-2"
  nop_alias = "solana-verifier-2"
  port = 8400
  committee_name = "default"
  node_index = 3
  chain_family = "solana"
  [verifier.db]
    image = "postgres:16-alpine"
    name = "solana-verifier-2-db"
    port = 8437

#############################
# Executors (standalone)    #
#############################

# EVM executor — submits to EVM destination chain (Solana→EVM direction)
[[executor]]
  image = "executor:latest"
  container_name = "default-executor-1"
  nop_alias = "default-executor-1"
  executor_qualifier = "default"
  [executor.db]
    image = "postgres:16-alpine"
    name = "default-executor-1-db"

# Solana executor — submits to Solana destination chain (EVM→Solana direction)
[[executor]]
  image = "solana-executor:latest"
  chain_family = "solana"
  source_code_path = "chainlink-ccip-solana/cmd/executor"
  root_path = ".."
  container_name = "solana-executor-1"
  nop_alias = "solana-executor-1"
  executor_qualifier = "default"

  [executor.db]
    image = "postgres:16-alpine"
    name = "solana-executor-1-db"

#############################
# Aggregator                #
#############################

[[aggregator]]
  committee_name = "default"
  image = "aggregator:latest"
  host_port = 50051
  redundant_aggregators = 0

  [aggregator.db]
    image = "postgres:16-alpine"
    host_port = 7432

  [aggregator.redis]
    image = "redis:7-alpine"
    host_port = 6379

  # EVM verifiers
  [[aggregator.api_clients]]
  client_id = "evm-verifier-1"
  description = "EVM verifier 1"
  enabled = true
  groups = ["verifiers"]

  [[aggregator.api_clients]]
  client_id = "evm-verifier-2"
  description = "EVM verifier 2"
  enabled = true
  groups = ["verifiers"]

  # Solana verifiers
  [[aggregator.api_clients]]
  client_id = "solana-verifier-1"
  description = "Solana verifier 1"
  enabled = true
  groups = ["verifiers"]

  [[aggregator.api_clients]]
  client_id = "solana-verifier-2"
  description = "Solana verifier 2"
  enabled = true
  groups = ["verifiers"]

  [[aggregator.api_clients]]
  client_id = "monitoring"
  description = "Monitoring and infrastructure client"
  enabled = true
  groups = ["monitoring"]

  [[aggregator.api_clients]]
  client_id = "indexer"
  description = "Development Indexer"
  enabled = true
  groups = ["indexer"]

  # Executors
  [[aggregator.api_clients]]
  client_id = "default-executor-1"
  description = "EVM executor 1"
  enabled = true
  groups = ["executors"]

  [[aggregator.api_clients]]
  client_id = "solana-executor-1"
  description = "Solana executor 1"
  enabled = true
  groups = ["executors"]

  [aggregator.env]
    storage_connection_url = "postgresql://aggregator:aggregator@default-aggregator-db:5432/aggregator?sslmode=disable"
    redis_address = "default-aggregator-redis:6379"
    redis_password = ""
    redis_db = "0"

#############################
# Indexer                   #
#############################

[[indexer]]
  image = "indexer:latest"
  port = 8104
  redundant_indexers = 0
  storage_connection_url = "postgresql://indexer:indexer@indexer-db:5432/indexer?sslmode=disable"
  [indexer.db]
    image = "postgres:16-alpine"

[indexer.indexer_config]
LogLevel = 'info'

[indexer.indexer_config.Monitoring]
Enabled = false

[[indexer.indexer_config.Discoveries]]
Address = "default-aggregator:50051"
Since = 0
PollInterval = 500
Timeout = 5000
NtpServer = "time.google.com"

[indexer.indexer_config.Scheduler]
TickerInterval = 50
VerificationVisibilityWindow = 28800
BaseDelay = 100
MaxDelay = 30_000

[indexer.indexer_config.Pool]
ConcurrentWorkers = 1000
WorkerTimeout = 300

[[indexer.indexer_config.Verifier]]
Type = "aggregator"
Name = "CommitteeVerifier (Primary)"
Address = "default-aggregator:50051"
InsecureConnection = true
BatchSize = 100
MaxBatchWaitTime = 50
Since = 0

[indexer.committee_verifier_name_to_qualifier]
"CommitteeVerifier (Primary)" = "default"

[indexer.indexer_config.Storage]
Strategy = "single"

[indexer.indexer_config.Storage.Single]
Type = "postgres"

[indexer.indexer_config.Storage.Single.Postgres]
MaxOpenConnections = 20
MaxIdleConnections = 5
IdleInTxSessionTimeout = 60
LockTimeout = 30

[indexer.secrets.Storage.Single.Postgres]
URI = "postgresql://indexer:indexer@indexer-db:5432/indexer?sslmode=disable"

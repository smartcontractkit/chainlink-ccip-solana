[package]
name = "mock_lombard_mailbox"
version.workspace = true
description = "Deliberately minimal mock of the real Lombard `mailbox` program's on-chain interface, used only by the devenv end-to-end test to exercise lombard-token-pool's bridge/mailbox CPIs. Never deployed for real."
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_lombard_mailbox"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor_discriminator = { path = "../../crates/anchor_discriminator" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))']

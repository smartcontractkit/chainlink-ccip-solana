[package]
name = "mock_lombard_bridge"
version.workspace = true
description = "Minimal mock of the real Lombard `bridge` program's on-chain interface"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "mock_lombard_bridge"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
solana-sha256-hasher = { version = "3", features = ["sha2"] }
base-token-pool = { path = "../base-token-pool/", features = [
    "no-entrypoint",
] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))']

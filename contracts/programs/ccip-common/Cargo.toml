[package]
name = "ccip_common"
version.workspace = true
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "ccip_common"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
# ccip-common is not to be deployed, so using the no-entrypoint feature
# prevents global allocator conflicts with its dependees.
default = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
solana-keccak-hasher = { workspace = true }
solana-address-lookup-table-interface = { workspace = true }
anchor-spl = { workspace = true }
ethnum = "1.5"
anchor_discriminator = { path = "../../crates/anchor_discriminator" }
arrayvec = { path = "../../crates/arrayvec" }

[dev-dependencies]
hex = "0.4.3"
solana-keccak-hasher = { workspace = true, features = ["sha3"]}

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]

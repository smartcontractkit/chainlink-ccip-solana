[package]
name = "test_program"
version.workspace = true
description = "Created with Anchor"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_program"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
custom-entrypoint = ["no-entrypoint"]
default = ["custom-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "ccip_common/idl-build", "ccip_router/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
solana-keccak-hasher = { workspace = true }
anchor-spl = { workspace = true }
ccip_router = { path = "../ccip-router", features = [
	"no-entrypoint",
] }
ccip_common = { path = "../ccip-common" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
	'cfg(target_os, values("solana"))',
	'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]

[package]
name = "arbitrary_cpi_proxy"
version.workspace = true
description = "Generic CPI proxy for testing. Executes arbitrary CPIs signed with a PDA, enabling tests of programs that authenticate callers via PDA (pools, executor, verifier, etc.)."
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "arbitrary_cpi_proxy"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { workspace = true }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))']

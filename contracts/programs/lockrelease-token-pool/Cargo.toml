[package]
name = "lockrelease-token-pool"
version.workspace = true
description = "Created with Anchor"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "lockrelease_token_pool"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "ccip_common/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ethnum = "1.5"
base-token-pool = { path = "../base-token-pool/", features = [
    "no-entrypoint",
] }
rmn_remote = { path = "../rmn-remote", features = [
    "cpi",
] }
ccip_common = { path = "../ccip-common" }
solana-security-txt = "1.1.1"

[build-dependencies]
build_commit = { path = "../../crates/build-commit" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]

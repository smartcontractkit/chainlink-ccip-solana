[package]
name = "test_ccip_receiver"
version.workspace = true
description = "Created with Anchor"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "test_ccip_receiver"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
# See the allocator declaration in src/lib.rs. `custom-heap` is a magic feature name.
custom-heap = []
default = ["custom-heap"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
example_ccip_receiver = { path = "../example-ccip-receiver", features = ["no-entrypoint"] }
probing-bump-allocator = { path = "../../crates/probing-bump-allocator" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))']

[package]
name = "cctp-token-pool"
version.workspace = true
description = "USDC Token Pool for CCIP utilizing CCTP"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "cctp_token_pool"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "ccip_common/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
anchor_discriminator = { path = "../../crates/anchor_discriminator" }
base-token-pool = { path = "../base-token-pool/", features = [
    "no-entrypoint",
] }
ccip_common = { path = "../ccip-common" }
solana-security-txt = "1.1.1"

[build-dependencies]
build_commit = { path = "../../crates/build-commit" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]

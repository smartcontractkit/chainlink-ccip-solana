[package]
name = "base-token-pool"
version.workspace = true
description = "Created with Anchor"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "base_token_pool"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "rmn_remote/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
ethnum = "1.5"
rmn_remote = { path = "../rmn-remote", features = [ "cpi" ] }
ccip_common = { path = "../ccip-common" }
anchor_discriminator = { path = "../../crates/anchor_discriminator" }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-panic", "custom-heap", "no-idl", "no-log-ix-name"))',
]

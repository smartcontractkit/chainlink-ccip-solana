[workspace]
resolver = "2"
members = [
  "programs/*",
  "crates/*",
]
exclude = [
  # Has its own workspace + Cargo.lock to avoid pulling Surfpool
  "crates/allocator-demo",
]

# Every program shares one version
[workspace.package]
version = "2.1.0"

[workspace.metadata.cli]
solana = "4.3.0"

[workspace.dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed", "event-cpi"] }
anchor-spl = "1.1.2"
borsh = "1.6"
solana-program = "3"
solana-keccak-hasher = "3"
solana-secp256k1-recover = "3"
solana-sysvar = "3"
solana-address-lookup-table-interface = { version = "3", features = ["bincode", "bytemuck"] }
solana-system-interface = { version = "3", features = ["bincode"] }
solana-sdk-ids = "3"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.test]
overflow-checks = true
